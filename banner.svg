<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" rx="32" fill="url(#bgGrad)"/>

  <!-- Subtle red accent glow behind play triangle -->
  <circle cx="240" cy="200" r="100" fill="#e50914" opacity="0.18" filter="url(#glow)"/>

  <!-- Play button triangle -->
  <polygon points="195,140 195,260 305,200" fill="#e50914"/>

  <!-- AT text -->
  <text x="420" y="245" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="120" letter-spacing="6" fill="#ffffff">AT</text>

  <!-- Flix text -->
  <text x="600" y="245" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="120" letter-spacing="6" fill="#a0a0b0">Flix</text>

  <!-- Tagline -->
  <text x="420" y="290" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" letter-spacing="3" fill="#6a6a7a">CINEMATIC STREAMING FOR SAMSUNG TV</text>
</svg>
