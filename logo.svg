<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- Subtle red accent glow behind play triangle -->
  <circle cx="256" cy="220" r="90" fill="#e50914" opacity="0.15" filter="url(#glow)"/>

  <!-- Play button triangle -->
  <polygon points="220,170 220,270 310,220" fill="#e50914"/>

  <!-- AT text -->
  <text x="256" y="360" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="72" letter-spacing="4" fill="#ffffff">AT</text>

  <!-- Flix text -->
  <text x="256" y="410" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="36" letter-spacing="8" fill="#a0a0b0">FLIX</text>

  <!-- Bottom accent line -->
  <rect x="156" y="430" width="200" height="3" rx="1.5" fill="#e50914"/>
</svg>
